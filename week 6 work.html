<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            margin: 0%;
            background-color: #9627626c;
          }
          /*sticky= stays at the top of the page when you scroll down*/
          header {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #7e1c74a5;
            color: rgb(12, 1, 1);
            padding: 14px;
            text-align: center;
          }
          .card {
            background-color: #f4f4f44e;
            border-radius: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            max-width: 280px;
            text-align: center;
          }
         .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin:0 auto 10px;
            background-color: #301432a6;
            color: #333;
            font-size: 36px;
            line-height: 90px;
            img {
                width: 100%;
                height: 100%;
                border-radius: 50%;
            }
          }
          .bio {
            font-size: 14px;
            color: #555;
            margin-top: 12px;
            height: 40px;
            overflow: auto;
            text-align: left;
            border: 1px solid #ccc;
          }
         .fab {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background-color: #aa3c9fa5;
            color: white;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);

          }
          
    </style>
</head>
<body>
   <header>
      <h1>Profile Card</h1>
   </header> 
   <div class="card">
      <div class="avatar"> <img src="anushka.png" alt="Anushka Mishra" class="profile-pic"></div>
      <h2>Anushka Mishra</h2>
      <p>Web Developer</p>
      <p class="bio">A passionate web developer with a love for creating interactive user experiences. Always eager to learn new technologies and improve coding skills.</p>
   </div>
    <button class="fab">+</button>
</body>
</html>
